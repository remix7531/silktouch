version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock). flake.lock's nixpkgs
  # input is a separate matter: Dependabot doesn't understand Nix flake
  # inputs at all, which is why .github/workflows/update-flake-lock.yml
  # exists to cover that gap on its own schedule.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions used in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
